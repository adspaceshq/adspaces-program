[package]
name = "adspaces"
version = "0.1.0"
description = "Adspaces peer-to-peer ad-space marketplace: fixed-price claims and auctions escrowed in USDC"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "adspaces"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
devnet-short-review = []

[dependencies]
anchor-lang = "=1.2.1"
anchor-spl = "=1.2.1"

[dev-dependencies]
base64 = "0.22"
bincode = "1"
litesvm = "0.16.0"
solana-message = "4.2.4"
solana-account = "4.3.0"
solana-transaction = "4.1.5"
solana-signer = "3.0.1"
solana-keypair = "3.1.2"
spl-token = { version = "9", features = ["no-entrypoint"] }
spl-token-interface = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
